name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Проверка compose-файлов
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config -q
          POSTGRES_USER=u POSTGRES_PASSWORD=p POSTGRES_DB=d DOMAIN=example.com docker compose -f docker-compose.prod.yml config -q
