user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;                                   # не раскрываем версию nginx
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1024;

    # Единый request-id: берём из заголовка клиента или генерируем; уходит в приложение и в лог
    map $http_x_request_id $req_id { default $http_x_request_id; "" $request_id; }

    log_format json escape=json '{"ts":"$time_iso8601","remote":"$remote_addr","method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,"upstream_rt":"$upstream_response_time","request_id":"$req_id"}';
    access_log /var/log/nginx/access.log json;

    # Ограничение частоты запросов с одного IP: 20 запросов/с, всплеск до 40
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
